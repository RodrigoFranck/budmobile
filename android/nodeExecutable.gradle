ext.setProcessEnvironmentVariable = { String key, String value ->
    try {
        def envClass = Class.forName("java.lang.ProcessEnvironment")
        def putenvMethod = envClass.getDeclaredMethod("putenv", String.class, String.class)
        putenvMethod.setAccessible(true)
        putenvMethod.invoke(null, key, value)
        return true
    } catch (Throwable ignored) {
        try {
            def envClass = Class.forName("java.lang.ProcessEnvironment")
            def variableClass = Class.forName("java.lang.ProcessEnvironment\$Variable")
            def variableConstructor = variableClass.getDeclaredConstructor(String.class)
            variableConstructor.setAccessible(true)
            def variable = variableConstructor.newInstance(value)
            def theEnvironmentField = envClass.getDeclaredField("theEnvironment")
            theEnvironmentField.setAccessible(true)
            def env = theEnvironmentField.get(null) as Map<String, Object>
            env.put(key, variable)
            return true
        } catch (Throwable ignored2) {
            return false
        }
    }
}

ext.prependToPath = { String directory ->
    def path = System.getenv("PATH") ?: ""
    def segments = path.split(File.pathSeparator).findAll { it != null && !it.isEmpty() }
    if (segments.contains(directory)) {
        return
    }
    setProcessEnvironmentVariable("PATH", directory + File.pathSeparator + path)
}

ext.configureNodeForGradle = { File androidRoot ->
    def nodePath = resolveNodeExecutable(androidRoot)
    def binDir = new File(androidRoot, "bin").absolutePath
    def nodeWrapper = new File(binDir, "node")
    if (!nodeWrapper.canExecute()) {
        nodeWrapper.setExecutable(true)
    }

    if (nodePath == "node") {
        prependToPath(binDir)
        return
    }

    def nodeFile = new File(nodePath)
    if (!nodeFile.isFile()) {
        prependToPath(binDir)
        return
    }

    setProcessEnvironmentVariable("NODE_BINARY", nodePath)
    prependToPath(binDir)
    prependToPath(nodeFile.parent)
}
