// Resolves Node.js for Gradle (Android Studio often lacks nvm/fnm on PATH).

ext.findNodeFromNvm = {
    def nvmDir = System.getenv("NVM_DIR") ?: "${System.getProperty("user.home")}/.nvm"
    def versionsDir = new File(nvmDir, "versions/node")
    if (!versionsDir.isDirectory()) {
        return null
    }
    def versionDirs = versionsDir.listFiles()?.findAll { it.isDirectory() }?.sort { a, b -> b.name <=> a.name }
    for (def versionDir in versionDirs ?: []) {
        def candidate = new File(versionDir, "bin/node")
        if (candidate.canExecute()) {
            return candidate.absolutePath
        }
    }
    return null
}

ext.findNodeFromFnm = {
    def fnmVersionsDir = new File("${System.getProperty("user.home")}/.local/share/fnm/node-versions")
    if (!fnmVersionsDir.isDirectory()) {
        return null
    }
    def versionDirs = fnmVersionsDir.listFiles()?.findAll { it.isDirectory() }?.sort { a, b -> b.name <=> a.name }
    for (def versionDir in versionDirs ?: []) {
        def candidate = new File(versionDir, "installation/bin/node")
        if (candidate.canExecute()) {
            return candidate.absolutePath
        }
    }
    return null
}

ext.resolveNodeExecutable = { File androidRoot ->
    def fromEnv = System.getenv("NODE_BINARY")
    if (fromEnv != null && !fromEnv.isEmpty()) {
        return fromEnv
    }

    def localProperties = new Properties()
    def localPropertiesFile = new File(androidRoot, "local.properties")
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
        def fromLocal = localProperties.getProperty("node.executable")
        if (fromLocal != null && !fromLocal.isEmpty()) {
            return fromLocal
        }
    }

    def fromNvm = findNodeFromNvm()
    if (fromNvm != null) {
        return fromNvm
    }

    def fromFnm = findNodeFromFnm()
    if (fromFnm != null) {
        return fromFnm
    }

    return "node"
}

ext.configureNodeForGradle = { File androidRoot ->
    // Put android/bin first so `node` can be resolved via the shim.
    def binDir = new File(androidRoot, "bin").absolutePath
    def path = System.getenv("PATH") ?: ""
    if (!path.split(File.pathSeparator).contains(binDir)) {
        try {
            def envClass = Class.forName("java.lang.ProcessEnvironment")
            def putenvMethod = envClass.getDeclaredMethod("putenv", String.class, String.class)
            putenvMethod.setAccessible(true)
            putenvMethod.invoke(null, "PATH", binDir + File.pathSeparator + path)
        } catch (Throwable ignored) {
            // best-effort; settings.gradle also uses the shim via `sh`.
        }
    }
}

