pluginManagement {
  apply from: new File(settingsDir, "nodeExecutable.gradle")
  configureNodeForGradle(settingsDir)

  def nodeShim = new File(settingsDir, "bin/node")
  def nodeCommand = nodeShim.exists()
    ? ["sh", nodeShim.absolutePath]
    : [resolveNodeExecutable(settingsDir)]

  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeCommand + ["--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"])
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeCommand + ["--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })"])
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)

  def resolvedNodeBinary = resolveNodeExecutable(settingsDir)
  if (resolvedNodeBinary != null && !resolvedNodeBinary.isEmpty() && resolvedNodeBinary != "node") {
    System.setProperty("expo.autolinking.nodeBinary", resolvedNodeBinary)
  }
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'budmobile'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
